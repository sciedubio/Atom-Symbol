    <script type="text/babel">

        const MATERIALS = [

            { id: 'gold', name: '순금 반지', type: 'element', formula: 'Au', emoji: '💍', desc: '금(Au) 원자로만 이루어진 귀금속 원소' },

            { id: 'aluminum', name: '알루미늄 캔', type: 'element', formula: 'Al', emoji: '🥫', desc: '알루미늄(Al) 원자로 이루어진 금속 원소' },

            { id: 'dryice', name: '드라이아이스', type: 'compound', formula: 'CO₂', emoji: '🧊', desc: '탄소와 산소가 결합한 이산화 탄소(화합물)의 고체 상태' },
            { id: 'salt', name: '소금', type: 'compound', formula: 'NaCl', emoji: '🧂', desc: '나트륨과 염소가 결합하여 만들어진 짠맛의 화합물' },
            { id: 'bakingsoda', name: '제빵 소다', type: 'compound', formula: 'NaHCO₃', emoji: '🧁', desc: '나트륨, 수소, 탄소, 산소가 결합한 복잡한 화합물' }
        ];

        // 기호 규칙 데이터 (Mission 2)
        const RULE_ELEMENTS = [
            { ko: "수소", en: "Hydrogen", symbol: "H" }, { ko: "헬륨", en: "Helium", symbol: "He" },
            { ko: "탄소", en: "Carbon", symbol: "C" }, { ko: "염소", en: "Chlorine", symbol: "Cl" },
            { ko: "칼슘", en: "Calcium", symbol: "Ca" }, { ko: "구리", en: "Cuprum", symbol: "Cu" },
            { ko: "리튬", en: "Lithium", symbol: "Li" }, { ko: "규소", en: "Silicon", symbol: "Si" },
            { ko: "황",   en: "Sulfur", symbol: "S" }, { ko: "질소", en: "Nitrogen", symbol: "N" },
            { ko: "네온", en: "Neon", symbol: "Ne" }, { ko: "나트륨", en: "Natrium", symbol: "Na" },
            { ko: "마그네슘", en: "Magnesium", symbol: "Mg" }, { ko: "알루미늄", en: "Aluminium", symbol: "Al" },
            { ko: "철",   en: "Ferrum", symbol: "Fe" }, { ko: "플루오린", en: "Fluorine", symbol: "F" }
        ];

        // 메모리 게임 데이터 (Mission 3 - 풀 확장 및 난이도 설정)
        const FULL_ELEMENT_POOL = [
            { name: '수소', symbol: 'H' }, { name: '헬륨', symbol: 'He' },
            { name: '탄소', symbol: 'C' }, { name: '질소', symbol: 'N' },
            { name: '산소', symbol: 'O' }, { name: '플루오린', symbol: 'F' },
            { name: '네온', symbol: 'Ne' }, { name: '나트륨', symbol: 'Na' },
            { name: '마그네슘', symbol: 'Mg' }, { name: '알루미늄', symbol: 'Al' },
            { name: '규소', symbol: 'Si' }, { name: '인', symbol: 'P' },
            { name: '황', symbol: 'S' }, { name: '염소', symbol: 'Cl' },
            { name: '칼륨', symbol: 'K' }, { name: '칼슘', symbol: 'Ca' },
            { name: '철', symbol: 'Fe' }, { name: '구리', symbol: 'Cu' },
            { name: '은', symbol: 'Ag' }, { name: '금', symbol: 'Au' }
        ];
        
        const STAGE_CONFIG = [
            { pairs: 6, time: 40 }, // Stage 1
            { pairs: 8, time: 50 }, // Stage 2
            { pairs: 10, time: 60 } // Stage 3
        ];

        // OX 퀴즈 풀 (Report)
        const QUIZ_POOL = [
            { q: "물은 수소와 산소로 이루어진 화합물이다.", a: true, explain: "수소(H)와 산소(O)가 결합하여 전혀 다른 성질의 물(H₂O)이 되므로 화합물입니다." },
            { q: "다이아몬드는 한 가지 종류의 원소로만 이루어져 있다.", a: true, explain: "다이아몬드는 오직 탄소(C) 원자로만 이루어진 원소 물질입니다." },
            { q: "공기 중의 산소 기체(O₂)는 두 가지 이상의 원소로 이루어진 화합물이다.", a: false, explain: "산소 기체는 산소(O)라는 한 가지 원소로만 이루어져 있으므로 원소(물질)입니다." },
            { q: "화합물은 구성하는 원소들의 원래 성질을 그대로 유지한다.", a: false, explain: "화합물은 성분 원소들이 화학 반응을 통해 전혀 새로운 성질을 가진 물질이 됩니다." },
            { q: "철(Fe)은 한 가지 종류의 입자로만 이루어진 원소이다.", a: true, explain: "철은 분해해도 다른 물질이 되지 않는 한 가지 원소입니다." },
            { q: "소금(염화 나트륨)은 나트륨 원소와 염소 원소로 이루어진 화합물이다.", a: true, explain: "나트륨(Na)과 염소(Cl)가 결합한 화합물(NaCl)입니다." },
            { q: "모든 물질은 원소 기호를 사용하여 화학식으로 나타낼 수 있다.", a: true, explain: "원소 기호는 전 세계 공통 약속이며, 이를 조합하여 모든 물질을 표현할 수 있습니다." },
            { q: "헬륨(He)은 다른 원소와 잘 반응하여 화합물을 쉽게 만든다.", a: false, explain: "헬륨은 비활성 기체로, 다른 물질과 거의 반응하지 않고 혼자 존재합니다." },
            { q: "원소 기호의 첫 글자는 항상 대문자로 쓴다.", a: true, explain: "원소 기호는 첫 글자를 대문자로, 두 번째 글자가 있다면 소문자로 표기합니다." },
            { q: "수소(H)와 산소(O)가 반응하여 물(H₂O)이 되는 과정은 물리적 변화이다.", a: false, explain: "새로운 성질의 화합물이 생성되므로 화학적 변화입니다." }
        ];

        // ==========================================
        // 2-1. 물리/화학 코어 엔진 (Mission 1)
        // ==========================================
        class ChemPhysicsEngine {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.particles = [];
                this.links = [];
                this.animationId = null;
                this.isRunning = false;
                this.currentMaterial = null;
                this.mouseX = 0; this.mouseY = 0; this.isMouseDown = false;

                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    this.mouseX = e.clientX - rect.left;
                    this.mouseY = e.clientY - rect.top;
                });
                canvas.addEventListener('mousedown', () => this.isMouseDown = true);
                canvas.addEventListener('mouseup', () => this.isMouseDown = false);
                canvas.addEventListener('mouseleave', () => this.isMouseDown = false);
            }

            resize() {
                if(!this.canvas.parentElement) return;
                const rect = this.canvas.parentElement.getBoundingClientRect();
                this.canvas.width = rect.width;
                this.canvas.height = rect.height;
            }

            stop() {
                this.isRunning = false;
                if (this.animationId) cancelAnimationFrame(this.animationId);
            }

            start(materialId) {
                this.stop();
                this.currentMaterial = materialId;
                this.particles = []; this.links = [];
                this.generateParticles(materialId);
                this.isRunning = true;
                this.loop();
            }

            getColor(element) {
                const colors = { 'C': '#374151', 'O': '#ef4444', 'H': '#e0f2fe', 'He': '#fcd34d', 'Al': '#94a3b8', 'Au': '#fbbf24', 'Na': '#a855f7', 'Cl': '#22c55e' };
                return colors[element] || '#ffffff';
            }

            generateParticles(id) {
                const w = this.canvas.width, h = this.canvas.height;
                const cx = w / 2, cy = h / 2;

                const addParticle = (x, y, r, el, mass=1) => {
                    const p = { x, y, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, r, el, color: this.getColor(el), mass, originX: x, originY: y };
                    this.particles.push(p); return p;
                };
                const addLink = (p1, p2, dist, stiffness=0.1) => { this.links.push({ p1, p2, dist, stiffness }); };

                if (id === 'helium') {
                    for(let i=0; i<40; i++) {
                        const p = addParticle(Math.random()*w, Math.random()*h, 12, 'He', 0.5);
                        p.vx *= 3; p.vy *= 3;
                    }
                } 
                else if (id === 'diamond') {
                    const cols = 6, rows = 5, spacing = 40; const grid = [];
                    const startX = cx - ((cols-1)*spacing)/2, startY = cy - ((rows-1)*spacing)/2;
                    for(let r=0; r<rows; r++) {
                        grid[r] = [];
                        for(let c=0; c<cols; c++) {
                            const offset = (r%2===0) ? 0 : spacing/2;
                            grid[r][c] = addParticle(startX + c*spacing + offset, startY + r*spacing, 10, 'C', 2);
                        }
                    }
                    for(let r=0; r<rows; r++) {
                        for(let c=0; c<cols; c++) {
                            if(c < cols-1) addLink(grid[r][c], grid[r][c+1], spacing, 0.05);
                            if(r < rows-1) {
                                addLink(grid[r][c], grid[r+1][c], spacing, 0.05);
                                if(r%2===0 && c>0) addLink(grid[r][c], grid[r+1][c-1], spacing, 0.05);
                                if(r%2!==0 && c<cols-1) addLink(grid[r][c], grid[r+1][c+1], spacing, 0.05);
                            }
                        }
                    }
                }
                else if (id === 'water') {
                    for(let i=0; i<15; i++) {
                        const px = Math.random()*w, py = Math.random()*h;
                        const o = addParticle(px, py, 16, 'O', 2);
                        const h1 = addParticle(px-15, py+15, 8, 'H', 1);
                        const h2 = addParticle(px+15, py+15, 8, 'H', 1);
                        addLink(o, h1, 22, 0.1); addLink(o, h2, 22, 0.1); addLink(h1, h2, 30, 0.1);
                        const vx = (Math.random()-0.5)*2, vy = (Math.random()-0.5)*2;
                        o.vx = vx; o.vy = vy; h1.vx = vx; h1.vy = vy; h2.vx = vx; h2.vy = vy;
                    }
                }
                else if (id === 'dryice') {
                    for(let i=0; i<15; i++) {
                        const px = 50 + Math.random()*(w-100), py = 50 + Math.random()*(h-100);
                        const c = addParticle(px, py, 12, 'C', 1.5);
                        const o1 = addParticle(px-25, py, 14, 'O', 2);
                        const o2 = addParticle(px+25, py, 14, 'O', 2);
                        addLink(c, o1, 25, 0.1); addLink(c, o2, 25, 0.1); addLink(o1, o2, 50, 0.02);
                        addLink(c, {x: c.originX, y: c.originY}, 0, 0.02); // 제자리 진동 (고체 상태 유지)
                    }
                }
                else if (id === 'salt') {
                    const cols = 5, rows = 5, spacing = 35;
                    const startX = cx - ((cols-1)*spacing)/2, startY = cy - ((rows-1)*spacing)/2;
                    for(let r=0; r<rows; r++) {
                        for(let c=0; c<cols; c++) {
                            const el = (r+c)%2 === 0 ? 'Na' : 'Cl';
                            const rad = el === 'Na' ? 12 : 18;
                            const p = addParticle(startX + c*spacing, startY + r*spacing, rad, el, 2);
                            addLink(p, {x: p.originX, y: p.originY}, 0, 0.02);
                        }
                    }
                }
                else if (id === 'gold' || id === 'aluminum') {
                    const el = id === 'gold' ? 'Au' : 'Al', rad = id === 'gold' ? 16 : 14, mass = id === 'gold' ? 3 : 1.5;
                    const cols = 6, rows = 6, spacing = 32;
                    const startX = cx - ((cols-1)*spacing)/2, startY = cy - ((rows-1)*spacing)/2;
                    for(let r=0; r<rows; r++) {
                        for(let c=0; c<cols; c++) {
                            const p = addParticle(startX + c*spacing, startY + r*spacing, rad, el, mass);
                            addLink(p, {x: p.originX, y: p.originY}, 0, 0.05);
                        }
                    }
                }
                else if (id === 'bakingsoda') {
                    for(let i=0; i<8; i++) {
                        const px = Math.random()*w, py = Math.random()*h;
                        const na = addParticle(px, py, 12, 'Na', 1.5), h_a = addParticle(px+15, py, 8, 'H', 1);
                        const c = addParticle(px, py+20, 10, 'C', 1.5);
                        const o1 = addParticle(px-15, py+30, 14, 'O', 2), o2 = addParticle(px+15, py+30, 14, 'O', 2), o3 = addParticle(px, py+45, 14, 'O', 2);
                        addLink(na, c, 25, 0.05); addLink(h_a, c, 20, 0.05);
                        addLink(c, o1, 20, 0.05); addLink(c, o2, 20, 0.05); addLink(c, o3, 20, 0.05);
                        addLink(o1, o2, 25, 0.02); addLink(o2, o3, 25, 0.02); addLink(o3, o1, 25, 0.02);
                    }
                }
            }

            update() {
                const w = this.canvas.width, h = this.canvas.height;
                const bounce = 0.9;
                
                const isSolid = ['diamond', 'salt', 'gold', 'aluminum', 'bakingsoda', 'dryice'].includes(this.currentMaterial);
                const friction = isSolid ? 0.90 : 0.99; 
                const heatJitter = isSolid ? 0.05 : 0.2; 

                for (let i=0; i<3; i++) {
                    for (let link of this.links) {
                        const dx = link.p2.x - link.p1.x, dy = link.p2.y - link.p1.y;
                        const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
                        const force = (dist - link.dist) * link.stiffness;
                        const fx = (dx/dist) * force, fy = (dy/dist) * force;
                        if (link.p1.vx !== undefined) { link.p1.vx += fx/link.p1.mass; link.p1.vy += fy/link.p1.mass; }
                        if (link.p2.vx !== undefined) { link.p2.vx -= fx/(link.p2.mass||1); link.p2.vy -= fy/(link.p2.mass||1); }
                    }
                }

                for (let p of this.particles) {
                    if (this.isMouseDown) {
                        const dx = p.x - this.mouseX, dy = p.y - this.mouseY, dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 100) {
                            const force = (100 - dist) / 100;
                            p.vx += (dx/dist) * force * (isSolid ? 0.5 : 2);
                            p.vy += (dy/dist) * force * (isSolid ? 0.5 : 2);
                        }
                    }
                    p.vx += (Math.random()-0.5) * heatJitter; p.vy += (Math.random()-0.5) * heatJitter;
                    p.vx *= friction; p.vy *= friction;
                    p.x += p.vx; p.y += p.vy;

                    if (p.x - p.r < 0) { p.x = p.r; p.vx *= -bounce; }
                    if (p.x + p.r > w) { p.x = w - p.r; p.vx *= -bounce; }
                    if (p.y - p.r < 0) { p.y = p.r; p.vy *= -bounce; }
                    if (p.y + p.r > h) { p.y = h - p.r; p.vy *= -bounce; }
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.lineWidth = 3; this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                for (let link of this.links) {
                    if (link.p1.vx === undefined || link.p2.vx === undefined) continue;
                    this.ctx.beginPath(); this.ctx.moveTo(link.p1.x, link.p1.y); this.ctx.lineTo(link.p2.x, link.p2.y); this.ctx.stroke();
                }
                for (let p of this.particles) {
                    const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*1.5);
                    gradient.addColorStop(0, p.color); gradient.addColorStop(1, 'transparent');
                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.r*1.5, 0, Math.PI * 2); this.ctx.fillStyle = gradient; this.ctx.fill();

                    this.ctx.beginPath(); this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); this.ctx.fillStyle = p.color; this.ctx.fill();
                    this.ctx.strokeStyle = 'rgba(255,255,255,0.5)'; this.ctx.lineWidth = 1; this.ctx.stroke();

                    this.ctx.fillStyle = (p.el === 'C' || p.el === 'O' || p.el === 'Al') ? '#fff' : '#000';
                    if(p.el==='H') this.ctx.fillStyle = '#000';
                    this.ctx.font = `bold ${p.r}px "Noto Sans KR"`; this.ctx.textAlign = 'center'; this.ctx.textBaseline = 'middle';
                    this.ctx.fillText(p.el, p.x, p.y+1);
                }
            }

            loop() {
                if (!this.isRunning) return;
                this.update(); this.draw();
                this.animationId = requestAnimationFrame(() => this.loop());
            }
        }

        // ==========================================
        // 2-2. 규칙 게임 코어 엔진 (모바일 반응형 최적화)
        // ==========================================
        class RuleGameEngine {
            constructor(container, onComplete, onAlert) {
                this.container = container;
                this.onComplete = onComplete;
                this.onAlert = onAlert;
                this.problemGroups = [];
                this.currentGroupIdx = 0;
                this.solvedSlots = 0;
                this.totalSlots = 0;
                this.rowCounts = [];
                
                // 드래그 상태
                this.isDragging = false;
                this.draggedEl = null;
                this.offsetX = 0; this.offsetY = 0;
                this.origLeft = 0; this.origTop = 0;

                this.init();
            }

            init() {
                this.container.innerHTML = `
                    <div class="rg-canvas-container" id="rg-canvas">
                        <div class="rg-header">
                            <div style="font-weight:bold; font-size:14px;"><i class="fa-solid fa-shapes mr-2"></i>원소 기호 규칙</div>
                            <div style="font-size:11px; color:#fff; background:#f472b6; padding:3px 8px; border-radius:12px; font-weight:bold;">Mission 2</div>
                        </div>
                        <div class="rg-scroll-area" id="rg-scroll-area">
                            <div class="rg-instruction">원래 이름의 알파벳을 오른쪽 빈칸으로 드래그하여 기호를 완성하세요!</div>
                            <div class="rg-rows-container" id="rg-rows"></div>
                            <div style="text-align: center; margin-top: 20px;">
                                <button id="rg-next-btn" style="display:none; margin: 0 auto 40px auto; padding:12px 25px; font-weight:bold; background:#4CAF50; color:white; border-radius:25px; cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">다음 그룹 ➔</button>
                            </div>
                        </div>
                        <div class="rg-tracker" id="rg-tracker"></div>
                    </div>
                `;
                this.canvasEl = this.container.querySelector('#rg-canvas');
                this.scrollAreaEl = this.container.querySelector('#rg-scroll-area');
                this.rowsEl = this.container.querySelector('#rg-rows');
                this.trackerEl = this.container.querySelector('#rg-tracker');
                this.nextBtn = this.container.querySelector('#rg-next-btn');

                this.nextBtn.onclick = () => this.nextGroup();
                
                this.pointerMoveHandler = (e) => this.onMove(e);
                this.pointerUpHandler = (e) => this.onUp(e);
                document.addEventListener('pointermove', this.pointerMoveHandler);
                document.addEventListener('pointerup', this.pointerUpHandler);

                this.prepareData();
                this.loadGroup();
            }

            destroy() {
                document.removeEventListener('pointermove', this.pointerMoveHandler);
                document.removeEventListener('pointerup', this.pointerUpHandler);
                this.container.innerHTML = '';
            }

            prepareData() {
                const grouped = {};
                RULE_ELEMENTS.forEach(el => {
                    const f = el.symbol[0].toUpperCase();
                    if(!grouped[f]) grouped[f] = [];
                    grouped[f].push(el);
                });
                this.problemGroups = Object.values(grouped).map(g => g.sort((a,b) => {
                    if(a.symbol.length !== b.symbol.length) return a.symbol.length - b.symbol.length;
                    return a.symbol.localeCompare(b.symbol);
                }));

                // 트래커 생성
                RULE_ELEMENTS.forEach(el => {
                    const sp = document.createElement('span');
                    sp.className = 'rg-tracker-item';
                    sp.id = `trk-${el.ko}`;
                    sp.innerText = el.ko;
                    sp.onclick = () => {
                        const idx = this.problemGroups.findIndex(g => g.some(i => i.ko === el.ko));
                        if(idx !== -1 && idx !== this.currentGroupIdx) {
                            this.currentGroupIdx = idx;
                            this.loadGroup();
                        }
                    };
                    this.trackerEl.appendChild(sp);
                });
            }

            loadGroup() {
                if(this.currentGroupIdx >= this.problemGroups.length) {
                    this.onAlert("기호 규칙 마스터 완료! 🎉");
                    if(this.onComplete) this.onComplete();
                    this.currentGroupIdx = 0;
                    this.trackerEl.querySelectorAll('span').forEach(s => s.classList.remove('completed'));
                }
                const group = this.problemGroups[this.currentGroupIdx];
                this.solvedSlots = 0;
                this.totalSlots = group.reduce((sum, el) => sum + el.symbol.length, 0);
                this.rowCounts = new Array(group.length).fill(0);
                this.nextBtn.style.display = 'none';
                this.rowsEl.innerHTML = '';

                group.forEach((data, rIdx) => {
                    const row = document.createElement('div'); row.className = 'rg-problem-row';
                    const name = document.createElement('div'); name.className = 'rg-name';
                    name.innerHTML = `${data.ko} <span style="font-size:16px; color:#777;">(${data.en})</span> <span style="font-size:16px;">🔊</span>`;
                    name.onclick = () => {
                        if('speechSynthesis' in window) {
                            window.speechSynthesis.cancel();
                            const ut = new SpeechSynthesisUtterance(data.en);
                            ut.lang = 'en-US'; ut.rate = 0.85; window.speechSynthesis.speak(ut);
                        }
                    };

                    const inter = document.createElement('div'); inter.className = 'rg-interaction';
                    const src = document.createElement('div'); src.className = 'rg-source-word';
                    const tgt = document.createElement('div'); tgt.className = 'rg-target-area'; 

                    for(let i=0; i<data.symbol.length; i++) {
                        const box = document.createElement('div'); box.className = 'rg-drop-box';
                        box.dataset.tgt = i===0 ? data.symbol[i].toUpperCase() : data.symbol[i].toLowerCase();
                        box.dataset.slot = i; box.dataset.row = rIdx;
                        tgt.appendChild(box);
                    }

                    const letters = data.en.split('');
                    const isMobile = window.innerWidth < 768;
                    const tW = isMobile ? 32 : 35;
                    const tG = 3;
                    
                    src.style.width = `${letters.length * tW + (letters.length-1)*tG}px`;
                    letters.forEach((ch, i) => {
                        const tile = document.createElement('div'); tile.className = 'rg-tile';
                        const dChar = i===0 ? ch.toUpperCase() : ch.toLowerCase();
                        tile.innerText = dChar; tile.dataset.char = dChar; tile.dataset.row = rIdx;
                        tile.style.left = `${i * (tW + tG)}px`; tile.style.top = '0px';
                        tile.onpointerdown = (e) => this.onDown(e, tile);
                        src.appendChild(tile);
                    });

                    inter.innerHTML = '';
                    inter.appendChild(src);
                    inter.insertAdjacentHTML('beforeend', '<div class="rg-arrow">➔</div>');
                    inter.appendChild(tgt);
                    row.appendChild(name); row.appendChild(inter);
                    this.rowsEl.appendChild(row);
                });
            }

            onDown(e, tile) {
                if(tile.classList.contains('locked')) return;
                this.isDragging = true; this.draggedEl = tile;
                this.draggedEl.origParent = tile.parentElement;
                this.origLeft = parseFloat(tile.style.left)||0; this.origTop = parseFloat(tile.style.top)||0;
                
                const ghost = tile.cloneNode(true); ghost.classList.add('rg-ghost');
                tile.parentElement.appendChild(ghost); tile.ghostEl = ghost;

                const rect = tile.getBoundingClientRect();
                const cvsRect = this.canvasEl.getBoundingClientRect();
                this.offsetX = e.clientX - rect.left;
                this.offsetY = e.clientY - rect.top;

                this.canvasEl.appendChild(tile);
                tile.style.left = `${rect.left - cvsRect.left}px`;
                tile.style.top = `${rect.top - cvsRect.top}px`;
                tile.classList.add('dragging');
                tile.setPointerCapture(e.pointerId);
            }

            onMove(e) {
                if(!this.isDragging || !this.draggedEl) return;
                const cvsRect = this.canvasEl.getBoundingClientRect();
                const newX = e.clientX - cvsRect.left - this.offsetX;
                const newY = e.clientY - cvsRect.top - this.offsetY;
                this.draggedEl.style.left = `${newX}px`;
                this.draggedEl.style.top = `${newY}px`;
            }

            onUp(e) {
                if(!this.isDragging || !this.draggedEl) return;
                this.isDragging = false; this.draggedEl.classList.remove('dragging');
                this.draggedEl.releasePointerCapture(e.pointerId);

                const boxes = this.rowsEl.querySelectorAll('.rg-drop-box');
                const rect = this.draggedEl.getBoundingClientRect();
                const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
                let isDropped = false, isWrong = false, targetBox = null;

                for(let box of boxes) {
                    if(isDropped) continue;
                    const bRect = box.getBoundingClientRect();
                    if(cx >= bRect.left && cx <= bRect.right && cy >= bRect.top && cy <= bRect.bottom) {
                        if(box.classList.contains('filled') || box.dataset.row !== this.draggedEl.dataset.row) {
                            isWrong = true; targetBox = box; continue;
                        }
                        const tChar = box.dataset.tgt, dChar = this.draggedEl.dataset.char;
                        const slot = parseInt(box.dataset.slot);
                        if((slot===0 && dChar.toUpperCase()===tChar) || (slot===1 && dChar.toLowerCase()===tChar)) {
                            isDropped = true;
                            box.classList.add('filled', 'active'); box.appendChild(this.draggedEl);
                            this.draggedEl.innerText = tChar; this.draggedEl.classList.add('locked');
                            this.draggedEl.style.position = 'static'; this.draggedEl.onpointerdown = null;
                            this.draggedEl.ghostEl = null;
                            
                            this.solvedSlots++; this.rowCounts[box.dataset.row]++;
                            const elData = this.problemGroups[this.currentGroupIdx][box.dataset.row];
                            if(this.rowCounts[box.dataset.row] === elData.symbol.length) {
                                document.getElementById(`trk-${elData.ko}`).classList.add('completed');
                            }
                            if(this.solvedSlots === this.totalSlots) {
                                this.onAlert("정답입니다! 🎉");
                                this.nextBtn.innerText = this.currentGroupIdx >= this.problemGroups.length-1 ? "처음부터 다시 ↺" : "다음 그룹 ➔";
                                this.nextBtn.style.display = 'block';
                            }
                        } else {
                            isWrong = true; targetBox = box;
                        }
                    }
                }

                if(isWrong && !isDropped && targetBox) {
                    try {
                        const actx = new (window.AudioContext||window.webkitAudioContext)();
                        const osc = actx.createOscillator(), gain = actx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, actx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(100, actx.currentTime+0.15);
                        gain.gain.setValueAtTime(0.2, actx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime+0.15);
                        osc.connect(gain); gain.connect(actx.destination); osc.start(); osc.stop(actx.currentTime+0.15);
                    } catch(e){}
                    
                    const tRect = targetBox.getBoundingClientRect(), cvRect = this.canvasEl.getBoundingClientRect();
                    const x = document.createElement('div'); x.className = 'rg-x-mark'; x.innerText = '❌';
                    x.style.left = `${tRect.left - cvRect.left + tRect.width/2}px`;
                    x.style.top = `${tRect.top - cvRect.top + tRect.height/2}px`;
                    this.canvasEl.appendChild(x); setTimeout(() => x.remove(), 600);
                }

                if(!isDropped) {
                    this.draggedEl.origParent.appendChild(this.draggedEl);
                    this.draggedEl.style.transition = 'left 0.3s, top 0.3s';
                    this.draggedEl.style.left = `${this.origLeft}px`; 
                    this.draggedEl.style.top = `${this.origTop}px`;
                    const g = this.draggedEl.ghostEl;
                    setTimeout(() => { 
                        if(this.draggedEl) this.draggedEl.style.transition = 'transform 0.1s'; 
                        if(g) g.remove(); 
                    }, 300);
                    this.draggedEl.ghostEl = null;
                }
                this.draggedEl = null;
            }

            nextGroup() {
                this.currentGroupIdx++;
                this.loadGroup();
            }
        }

        const { useState, useEffect, useRef } = React;

        // 랭킹 등록 모달 (메모리 게임 클리어 후)
        const RankModal = ({ scoreData, onClose, onGoReport, viewOnly = false }) => {

            const submitRank = async () => {
                if(!name) return alert('이름을 입력하세요!');
                if(!GOOGLE_SCRIPT_URL) {
                    alert('DB가 연동되지 않았습니다.');
                    setStatus('list'); return;
                }
                setStatus('saving');
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: "saveRank", name: name, score: scoreData.score })
                    });
                    // 저장 후 약간의 대기 (시트 반영)
                    setTimeout(() => setStatus('list'), 1000);
                } catch(e) {
                    setStatus('list');
                }
            };

            return (
                <div className="fixed inset-0 z-[150] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in">
                    <div className="bg-chem-panel p-6 rounded-2xl w-full max-w-md shadow-2xl border border-chem-accent text-center relative">
                        <div className="text-5xl mb-2">🏆</div>
                        <h2 className="text-2xl font-black text-chem-accent mb-4">
                            {viewOnly ? '명예의 전당 (Top 10)' : '메모리 게임 종료!'}
                        </h2>
                        
                        {status === 'input' && !viewOnly && (
                            <div className="animate-pop">
                                <div className="text-gray-300 mb-4">
                                    <p>도달 스테이지: <span className="font-bold text-white">Stage {scoreData.stage}</span></p>
                                    <p className="text-xl mt-2 text-chem-primary">최종 점수: <strong>{scoreData.score}점</strong></p>
                                </div>
                                <input type="text" placeholder="랭킹에 등록할 이름 (예: 10101 홍길동)" className="w-full bg-slate-800 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:border-chem-accent mb-4 text-center" value={name} onChange={e=>setName(e.target.value)} maxLength="15" />
                                <button onClick={submitRank} className="w-full py-3 bg-chem-accent text-slate-900 font-bold rounded-xl active:scale-95 transition-transform">
                                    점수 등록하고 랭킹 보기
                                </button>
                                <button onClick={onGoReport} className="w-full py-2 mt-2 text-gray-400 text-sm hover:text-white">랭킹 안보고 결과보고서 쓰기</button>
                            </div>
                        )}

                        {status === 'saving' && (
                            <div className="py-10 animate-pulse text-chem-primary font-bold">
                                랭킹 서버에 전송 중... 🚀
                            </div>
                        )}

                        {status === 'list' && (
                            <div className="animate-pop">
                                {!viewOnly && <h3 className="text-lg font-bold border-b border-gray-600 pb-2 mb-3">명예의 전당 (Top 10)</h3>}
                                <div className="bg-slate-900 rounded-lg p-2 max-h-60 overflow-y-auto mb-4 text-sm">
                                    {ranks.length === 0 ? <p className="text-gray-500 py-4">랭킹 데이터가 없거나 로딩 중입니다.</p> : 
                                        ranks.map((r, i) => (
                                            <div key={i} className={`flex justify-between p-2 border-b border-gray-800 ${i===0 ? 'text-yellow-400 font-bold' : 'text-gray-300'}`}>
                                                <span>{i+1}. {r.name}</span>
                                                <span>{r.score}점</span>
                                            </div>
                                        ))
                                    }
                                </div>
                                {viewOnly ? (
                                    <button onClick={onClose} className="w-full py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl active:scale-95 transition-colors">
                                        닫기
                                    </button>
                                ) : (
                                    <>
                                        <button onClick={onGoReport} className="w-full py-3 bg-green-500 text-slate-900 font-bold rounded-xl active:scale-95 transition-transform">
                                            결과 보고서 작성하기
                                        </button>
                                        <button onClick={onClose} className="w-full py-2 mt-2 text-gray-400 text-sm hover:text-white">실험실로 돌아가기</button>
                                    </>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. Main App & Views
        // ==========================================
        const App = () => {
            const [view, setView] = useState('intro'); // intro, simulation, report, done
            const [alertMsg, setAlertMsg] = useState('');
            const [showAdmin, setShowAdmin] = useState(false);
            const [simData, setSimData] = useState({ classificationScore: 0, memoryScore: 0 });

            return (
                <div className="w-full h-full relative font-sans text-white bg-chem-dark">
                    <button onClick={() => setShowAdmin(true)} className="fixed top-4 right-4 z-50 text-gray-400 hover:text-white p-2 rounded-full glass shadow-lg">
                        <i className="fa-solid fa-gear"></i>
                    </button>
                    {view === 'intro' && <IntroView setView={setView} />}
                    {view === 'simulation' && <SimulationView setView={setView} simData={simData} setSimData={setSimData} setAlertMsg={setAlertMsg} />}
                    {view === 'report' && <ReportView setView={setView} simData={simData} setAlertMsg={setAlertMsg} />}
                    {view === 'done' && <DoneView setView={setView} />}
                    <CustomAlert msg={alertMsg} onClose={() => setAlertMsg('')} />
                    {showAdmin && <AdminModal onClose={() => setShowAdmin(false)} />}
                    {(view === 'intro' || view === 'done') && (
                        <div className="absolute bottom-4 w-full text-center text-gray-500 text-sm z-40 pointer-events-none">Created by Yang DH</div>
                    )}
                </div>
            );
        };

        const IntroView = ({ setView }) => (
            <div className="flex flex-col items-center justify-center h-full p-6 text-center bg-gradient-to-b from-chem-dark to-slate-900">
                <div className="w-32 h-32 mb-8 relative animate-bounce-slight">
                    <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[0_0_15px_rgba(56,189,248,0.5)]">
                        <circle cx="50" cy="50" r="10" fill="#38bdf8" />
                        <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#f472b6" strokeWidth="2" transform="rotate(30 50 50)" />
                        <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#34d399" strokeWidth="2" transform="rotate(-30 50 50)" />
                        <ellipse cx="50" cy="50" rx="40" ry="15" fill="none" stroke="#fbbf24" strokeWidth="2" transform="rotate(90 50 50)" />
                        <circle cx="85" cy="70" r="4" fill="#f472b6" className="animate-spin-slow" style={{transformOrigin: '50px 50px'}} />
                        <circle cx="15" cy="30" r="4" fill="#34d399" className="animate-spin-slow" style={{transformOrigin: '50px 50px', animationDelay: '-1s'}} />
                    </svg>
                </div>
                <h1 className="text-4xl md:text-5xl font-black mb-4 text-transparent bg-clip-text bg-gradient-to-r from-chem-primary to-chem-element">
                    원소 분석실 & 규칙 마스터
                </h1>
                <p className="text-lg text-gray-300 mb-8 max-w-lg leading-relaxed">
                    물질을 원소와 화합물로 분류하고,<br/>알파벳을 조합해 기호 규칙을 익힌 후,<br/>기호 메모리 게임 랭킹에 도전하세요!
                </p>
                <button onClick={() => setView('simulation')} className="px-8 py-4 bg-chem-primary text-slate-900 font-bold text-xl rounded-2xl shadow-[0_0_20px_rgba(56,189,248,0.4)] active:scale-95 transition-all">
                    <i className="fa-solid fa-flask mr-2"></i>실험 시작하기
                </button>
            </div>
        );

        const SimulationView = ({ setView, simData, setSimData, setAlertMsg }) => {
            const [activeMission, setActiveMission] = useState(1); // 1: 분류, 2: 규칙, 3: 메모리
            const [rankModalOpen, setRankModalOpen] = useState(false);
            const [memScoreObj, setMemScoreObj] = useState(null);
            const [isViewOnlyRank, setIsViewOnlyRank] = useState(false);

            // 미션 잠금 해제 상태 (기본적으로 1단계만 해제)
            const [unlockedMissions, setUnlockedMissions] = useState([1]);
            const [passwordModal, setPasswordModal] = useState({ isOpen: false, target: null });
            const [pwdInput, setPwdInput] = useState('');
            const [pwdError, setPwdError] = useState(false);

            // Mission 1 (Chem Engine)
            const canvasRef = useRef(null);
            const chemEngineRef = useRef(null);
            const [poolItems, setPoolItems] = useState([...MATERIALS].sort(() => Math.random() - 0.5));
            const [elementBin, setElementBin] = useState([]);
            const [compoundBin, setCompoundBin] = useState([]);
            const [selectedItem, setSelectedItem] = useState(null);
            const [analyzingItem, setAnalyzingItem] = useState(null);

            // Mission 2 (Rule Engine Wrapper)
            const ruleWrapperRef = useRef(null);
            const ruleEngineRef = useRef(null);

            // Mission 3 (Memory Game)
            const [cards, setCards] = useState([]);
            const [flippedIndices, setFlippedIndices] = useState([]);
            const [matchedPairs, setMatchedPairs] = useState([]);
            const [isRevealing, setIsRevealing] = useState(false);
            
            // Mission 3 New States (Stages, Timer, Score)
            const [stage, setStage] = useState(0);
            const [timeLeft, setTimeLeft] = useState(0);
            const [totalScore, setTotalScore] = useState(0);
            const [gameStatus, setGameStatus] = useState('ready'); // ready, playing, stage_clear, game_over, all_clear

            // Audio Helper
            const playBeep = (freq, type, duration) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator(), gain = ctx.createGain();
                    osc.type = type; osc.frequency.value = freq; osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration); osc.stop(ctx.currentTime + duration);
                } catch(e) {}
            };

            // Init Engines
            useEffect(() => {
                if (activeMission === 1) {
                    if(!chemEngineRef.current && canvasRef.current) chemEngineRef.current = new ChemPhysicsEngine(canvasRef.current);
                    if(chemEngineRef.current && analyzingItem) chemEngineRef.current.start(analyzingItem.id);
                } else {
                    if(chemEngineRef.current) chemEngineRef.current.stop();
                }

                if (activeMission === 2) {
                    if(!ruleEngineRef.current && ruleWrapperRef.current) {
                        ruleEngineRef.current = new RuleGameEngine(ruleWrapperRef.current, () => {}, setAlertMsg);
                    }
                } else {
                    if(ruleEngineRef.current) { ruleEngineRef.current.destroy(); ruleEngineRef.current = null; }
                }

                if (activeMission === 3 && gameStatus === 'ready') {
                    initStage(0, false);
                }
            }, [activeMission, analyzingItem]);

            // Memory Game Timer
            useEffect(() => {
                let timer = null;
                if (activeMission === 3 && gameStatus === 'playing' && !isRevealing) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                playBeep(150, 'sawtooth', 0.5);
                                setGameStatus('game_over');
                                return 0;
                            }
                            if (prev <= 6) playBeep(800, 'sine', 0.05); // 촉박한 틱틱 소리
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [activeMission, gameStatus, isRevealing]);

            // Mission 1 Handlers
            const handleItemSelect = (item) => { setSelectedItem(item); setAnalyzingItem(item); };
            const handleDrop = (targetType) => {
                if (!selectedItem) return;
                if (selectedItem.type === targetType) {
                    setSimData(prev => ({...prev, classificationScore: prev.classificationScore + 1}));
                    setPoolItems(prev => prev.filter(i => i.id !== selectedItem.id));
                    if(targetType === 'element') setElementBin(prev => [...prev, selectedItem]);
                    else setCompoundBin(prev => [...prev, selectedItem]);
                    setSelectedItem(null); playBeep(800, 'sine', 0.1);
                } else {
                    setAlertMsg(`앗! ${selectedItem.name}은(는) ${targetType==='element'?'화합물':'원소'}입니다.`);
                    playBeep(200, 'sawtooth', 0.2); setSelectedItem(null);
                }
            };
            const resetMission1 = () => {
                setPoolItems([...MATERIALS].sort(() => Math.random() - 0.5));
                setElementBin([]); setCompoundBin([]); setSelectedItem(null); setAnalyzingItem(null);
                if(chemEngineRef.current) chemEngineRef.current.stop();
            };

            // Mission 3 Handlers
            const initStage = (targetStage, preserveScore = false) => {
                const config = STAGE_CONFIG[targetStage];
                // 1. 전체 풀에서 이번 스테이지에 사용할 원소 랜덤 추출
                const shuffledPool = [...FULL_ELEMENT_POOL].sort(() => Math.random() - 0.5).slice(0, config.pairs);
                
                // 2. 카드 덱 생성 (이름 + 기호 쌍)
                let deck = [];
                shuffledPool.forEach((pair, idx) => {
                    deck.push({ id: `name_${idx}`, type: 'name', value: pair.name, pairId: idx });
                    deck.push({ id: `sym_${idx}`, type: 'symbol', value: pair.symbol, pairId: idx });
                });
                const shuffledDeck = deck.sort(() => Math.random() - 0.5);
                setCards(shuffledDeck);
                
                // 3. 상태 초기화
                setStage(targetStage);
                setTimeLeft(config.time);
                if (!preserveScore) setTotalScore(0);
                
                setIsRevealing(true);
                setFlippedIndices(shuffledDeck.map((_, i) => i)); // 모두 앞면으로 뒤집기
                setMatchedPairs([]);
                setGameStatus('playing');
                
                // 3초 후 카드 덮기
                setTimeout(() => {
                    setFlippedIndices([]);
                    setIsRevealing(false);
                }, 3000);
            };

            const initMemoryGame = () => initStage(0, false);

            const handleCardClick = (idx) => {
                if (isRevealing || gameStatus !== 'playing' || flippedIndices.length >= 2 || flippedIndices.includes(idx) || matchedPairs.includes(cards[idx].pairId)) return;
                
                const newFlipped = [...flippedIndices, idx];
                setFlippedIndices(newFlipped);
                
                if (newFlipped.length === 2) {
                    const c1 = cards[newFlipped[0]], c2 = cards[newFlipped[1]];
                    if (c1.pairId === c2.pairId) {
                        setTimeout(() => {
                            const newMatched = [...matchedPairs, c1.pairId];
                            setMatchedPairs(newMatched); 
                            setFlippedIndices([]); 
                            playBeep(1000, 'sine', 0.1);
                            setTotalScore(s => s + 20); // 쌍을 맞출 때마다 +20점
                            
                            if (newMatched.length === STAGE_CONFIG[stage].pairs) {
                                // 스테이지 클리어 연출
                                playBeep(523, 'sine', 0.2); setTimeout(()=>playBeep(659, 'sine', 0.2), 200); setTimeout(()=>playBeep(784, 'sine', 0.4), 400);
                                
                                if (stage >= STAGE_CONFIG.length - 1) {
                                    setGameStatus('all_clear');
                                    setSimData(prev => ({...prev, memoryScore: totalScore + 20 + (timeLeft * 5)})); // 최종 랭킹 점수 로컬 저장
                                } else {
                                    setGameStatus('stage_clear');
                                }
                            }
                        }, 500);
                    } else { 
                        // 오답 페널티 (시간 감소)
                        playBeep(200, 'sawtooth', 0.2);
                        setTimeLeft(prev => {
                            const next = Math.max(0, prev - 3);
                            if (next === 0) setGameStatus('game_over');
                            return next;
                        });
                        setTimeout(() => setFlippedIndices([]), 800); 
                    }
                }
            };

            const openRankModal = (bonus = 0) => {
                setMemScoreObj({ stage: stage + 1, score: totalScore + bonus });
                setRankModalOpen(true);
            };

            // 탭 클릭 및 암호 확인 핸들러
            const handleTabClick = (mission) => {
                if (unlockedMissions.includes(mission)) {
                    setActiveMission(mission);
                } else {
                    setPasswordModal({ isOpen: true, target: mission });
                    setPwdInput('');
                    setPwdError(false);
                }
            };

            const handlePasswordSubmit = () => {
                const { target } = passwordModal;
                if ((target === 2 && pwdInput === '8282') || (target === 3 && pwdInput === '3030')) {
                    setUnlockedMissions(prev => [...prev, target]);
                    setActiveMission(target);
                    setPasswordModal({ isOpen: false, target: null });
                } else {
                    setPwdError(true);
                }
            };

            return (
                <div className="flex flex-col h-full overflow-hidden">
                    {/* Top Control Bar */}
                    <div className="flex-none p-3 glass flex justify-between items-center border-b border-gray-700 z-10 overflow-x-auto hide-scrollbar">
                        <div className="flex space-x-1 bg-gray-900 p-1 rounded-lg">
                            <button onClick={() => handleTabClick(1)} className={`whitespace-nowrap px-3 py-1.5 rounded text-sm font-bold transition-colors ${activeMission === 1 ? 'bg-chem-primary text-slate-900' : 'text-gray-400 hover:text-white'}`}>
                                물질 분류
                            </button>
                            <button onClick={() => handleTabClick(2)} className={`whitespace-nowrap px-3 py-1.5 rounded text-sm font-bold transition-colors ${activeMission === 2 ? 'bg-pink-400 text-slate-900' : 'text-gray-400 hover:text-white'}`}>
                                {!unlockedMissions.includes(2) && <i className="fa-solid fa-lock text-xs mr-1 opacity-70"></i>}기호 규칙
                            </button>
                            <button onClick={() => handleTabClick(3)} className={`whitespace-nowrap px-3 py-1.5 rounded text-sm font-bold transition-colors ${activeMission === 3 ? 'bg-chem-accent text-slate-900' : 'text-gray-400 hover:text-white'}`}>
                                {!unlockedMissions.includes(3) && <i className="fa-solid fa-lock text-xs mr-1 opacity-70"></i>}기호 메모리
                            </button>
                        </div>
                        <div className="flex space-x-2 ml-4">
                            <button onClick={activeMission===1 ? resetMission1 : activeMission===3 ? initMemoryGame : null} className={`px-3 py-1.5 bg-gray-700 rounded text-xs font-bold active:scale-95 ${activeMission===2?'hidden':''}`}><i className="fa-solid fa-rotate-right mr-1"></i>리셋</button>
                            <button onClick={() => setView('report')} className="whitespace-nowrap px-3 py-1.5 bg-green-500 text-slate-900 rounded text-xs font-bold active:scale-95">보고서 <i className="fa-solid fa-arrow-right"></i></button>
                        </div>
                    </div>

                    <div className="flex-1 relative w-full h-full overflow-hidden flex">
                        {/* Mission 1 */}
                        {activeMission === 1 && (
                            <div className="w-full h-full flex flex-col md:flex-row">
                                <div className="relative w-full md:w-1/2 h-1/3 md:h-full order-1 md:order-2 border-b md:border-b-0 md:border-l border-gray-700 bg-[#0f172a]">
                                    <canvas ref={canvasRef} className="w-full h-full canvas-bg"></canvas>
                                    <div className="absolute top-0 left-0 w-full p-4 pointer-events-none">
                                        <h2 className="text-lg font-bold text-chem-primary"><i className="fa-solid fa-microscope mr-2"></i>분자 구조 분석실</h2>
                                        {analyzingItem && (
                                            <div className="mt-2 glass p-3 rounded-lg inline-block text-sm max-w-xs animate-fade-in pointer-events-auto">
                                                <div className="font-bold text-white text-base">{analyzingItem.name} <span className="text-chem-accent ml-1">{analyzingItem.formula}</span></div>
                                                <div className="text-gray-300 mt-1">{analyzingItem.desc}</div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                                <div className="w-full md:w-1/2 h-2/3 md:h-full order-2 md:order-1 p-4 overflow-y-auto hide-scrollbar flex flex-col">
                                    <div className="glass p-3 rounded-xl mb-4 border border-gray-700 flex-none">
                                        <div className="text-sm text-gray-400 mb-2 flex justify-between"><span><i className="fa-solid fa-hand-pointer mr-2"></i>선택</span><span className="text-chem-primary font-bold">남음: {poolItems.length}</span></div>
                                        <div className="flex flex-wrap gap-2">
                                            {poolItems.map(item => (
                                                <button key={item.id} onClick={() => handleItemSelect(item)} className={`px-2 py-1.5 rounded flex items-center gap-1 transition-all active:scale-95 ${selectedItem?.id === item.id ? 'bg-chem-accent text-slate-900 font-bold scale-105 shadow-lg' : 'bg-slate-700 text-sm'}`}>
                                                    <span>{item.emoji}</span><span>{item.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="flex-1 flex gap-2 min-h-0">
                                        <div onClick={() => handleDrop('element')} className={`flex-1 glass rounded-xl p-2 flex flex-col border-2 cursor-pointer ${selectedItem?'border-chem-element animate-pulse':'border-gray-700'}`}>
                                            <div className="font-black text-chem-element text-center border-b border-gray-700 pb-1 mb-2">원소</div>
                                            <div className="flex-1 overflow-y-auto space-y-1">
                                                {elementBin.map(i => <div key={i.id} className="bg-slate-800 p-1.5 rounded text-xs flex justify-between border-l-2 border-chem-element"><span>{i.emoji} {i.name}</span><span className="text-gray-400 font-mono">{i.formula}</span></div>)}
                                            </div>
                                        </div>
                                        <div onClick={() => handleDrop('compound')} className={`flex-1 glass rounded-xl p-2 flex flex-col border-2 cursor-pointer ${selectedItem?'border-chem-compound animate-pulse':'border-gray-700'}`}>
                                            <div className="font-black text-chem-compound text-center border-b border-gray-700 pb-1 mb-2">화합물</div>
                                            <div className="flex-1 overflow-y-auto space-y-1">
                                                {compoundBin.map(i => <div key={i.id} className="bg-slate-800 p-1.5 rounded text-xs flex justify-between border-l-2 border-chem-compound"><span>{i.emoji} {i.name}</span><span className="text-gray-400 font-mono">{i.formula}</span></div>)}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Mission 2 */}
                        {activeMission === 2 && (
                            <div ref={ruleWrapperRef} className="w-full h-full relative overflow-hidden bg-[#2c3e50] flex justify-center items-center">
                                {/* RuleGameEngine will inject DOM here */}
                            </div>
                        )}

                        {/* Mission 3 */}
                        {activeMission === 3 && (
                            <div className="w-full h-full flex flex-col items-center justify-center p-4 relative">
                                <div className="w-full max-w-3xl glass p-6 rounded-2xl shadow-2xl flex flex-col items-center border border-gray-700 relative overflow-hidden">
                                    <div className="w-full flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-black text-chem-accent flex flex-wrap items-center gap-2">
                                            <span><i className="fa-solid fa-gamepad mr-2"></i>기호 메모리 랭킹전 (Stage {stage + 1})</span>
                                            <button 
                                                onClick={() => { setIsViewOnlyRank(true); setRankModalOpen(true); }}
                                                className="px-3 py-1 bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-lg text-sm font-bold active:scale-95 hover:bg-yellow-500/30 transition-colors flex items-center"
                                            >
                                                <i className="fa-solid fa-trophy mr-1"></i>랭킹 보기
                                            </button>
                                            {isRevealing && <span className="text-chem-primary ml-2 text-sm animate-pulse">👀 3초간 외우세요!</span>}
                                        </h2>
                                        <div className="text-right">
                                            <div className={`text-2xl font-mono font-black ${timeLeft <= 5 ? 'text-red-500 animate-pulse' : 'text-chem-element'}`}>
                                                ⏳ {timeLeft}초
                                            </div>
                                            <div className="text-gray-300 font-mono text-sm">점수: {totalScore}점</div>
                                        </div>
                                    </div>
                                    
                                    <div className={`grid ${cards.length > 16 ? 'grid-cols-5 md:grid-cols-5' : 'grid-cols-4'} gap-2 w-full perspective-1000 max-w-[500px]`}>
                                        {cards.map((card, idx) => {
                                            const isFlipped = flippedIndices.includes(idx) || matchedPairs.includes(card.pairId);
                                            return (
                                                <div key={idx} onClick={() => handleCardClick(idx)} className="relative aspect-[3/4] sm:aspect-square cursor-pointer transform-style-3d card-transition w-full" style={{ transform: isFlipped ? 'rotateY(180deg)' : '' }}>
                                                    <div className={`absolute inset-0 backface-hidden bg-gradient-to-br from-slate-700 to-slate-800 rounded-lg flex items-center justify-center shadow hover:border-chem-primary border ${isRevealing ? 'border-chem-accent':'border-gray-600'}`}>
                                                        <i className="fa-solid fa-atom text-white/30 text-xl"></i>
                                                    </div>
                                                    <div className={`absolute inset-0 backface-hidden rotate-y-180 rounded-lg flex items-center justify-center border-2 transition-all ${matchedPairs.includes(card.pairId) ? 'bg-slate-800 border-chem-element opacity-50' : 'bg-slate-900 border-chem-primary'}`}>
                                                        {card.type === 'symbol' ? <span className="text-2xl font-black text-chem-primary font-mono">{card.value}</span> : <span className="text-sm font-bold text-white text-center break-keep leading-tight px-1">{card.value}</span>}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {/* Overlays for Game States */}
                                    {gameStatus === 'stage_clear' && (
                                        <div className="absolute inset-0 bg-black/85 flex flex-col items-center justify-center z-10 animate-fade-in backdrop-blur-sm">
                                            <div className="text-5xl mb-4 animate-bounce-slight">🌟</div>
                                            <h3 className="text-3xl font-black text-chem-element mb-2">Stage {stage + 1} 클리어!</h3>
                                            <p className="text-gray-300 mb-6 text-lg">남은 시간 보너스: <span className="text-chem-accent font-bold">+{timeLeft * 5}점</span></p>
                                            <button onClick={() => {
                                                setTotalScore(s => s + (timeLeft * 5));
                                                initStage(stage + 1, true);
                                            }} className="px-8 py-3 bg-chem-accent text-slate-900 text-lg font-bold rounded-xl active:scale-95 shadow-lg shadow-chem-accent/30">다음 스테이지 도전 ➔</button>
                                        </div>
                                    )}
                                    
                                    {gameStatus === 'all_clear' && (
                                        <div className="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-10 animate-fade-in backdrop-blur-sm">
                                            <div className="text-6xl mb-4 animate-pop">🏆</div>
                                            <h3 className="text-3xl font-black text-chem-primary mb-2">모든 스테이지 마스터!</h3>
                                            <p className="text-xl text-chem-accent mb-6 font-bold">최종 점수: {totalScore + (timeLeft * 5)}점</p>
                                            <button onClick={() => {
                                                const finalScore = totalScore + (timeLeft * 5);
                                                setTotalScore(finalScore);
                                                openRankModal(timeLeft * 5);
                                            }} className="px-8 py-4 bg-chem-primary text-slate-900 text-xl font-bold rounded-xl active:scale-95 shadow-[0_0_30px_rgba(56,189,248,0.6)]">명예의 전당 등록하기</button>
                                        </div>
                                    )}
                                    
                                    {gameStatus === 'game_over' && (
                                        <div className="absolute inset-0 bg-red-950/90 flex flex-col items-center justify-center z-10 animate-fade-in backdrop-blur-sm">
                                            <div className="text-6xl mb-4">💀</div>
                                            <h3 className="text-4xl font-black text-white mb-2">시간 초과!</h3>
                                            <p className="text-gray-300 mb-8 text-lg">최종 점수: <span className="text-chem-accent font-bold">{totalScore}점</span></p>
                                            <div className="flex gap-4">
                                                <button onClick={() => initStage(0, false)} className="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl active:scale-95 transition-colors">처음부터 다시</button>
                                                <button onClick={() => openRankModal(0)} className="px-6 py-3 bg-chem-accent hover:bg-yellow-400 text-slate-900 font-bold rounded-xl active:scale-95 transition-colors shadow-lg">현재 점수 랭킹 등록</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 암호 입력 모달 */}
                    {passwordModal.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-md p-4 animate-fade-in">
                            <div className="bg-chem-panel p-6 rounded-2xl w-full max-w-sm shadow-2xl border border-chem-accent text-center relative">
                                <div className="text-4xl mb-4">🔒</div>
                                <h2 className="text-xl font-bold text-white mb-2">{passwordModal.target}단계 미션 암호</h2>
                                <p className="text-sm text-gray-400 mb-4">선생님이 알려주신 암호를 입력하세요.</p>
                                <input 
                                    type="password" 
                                    pattern="[0-9]*" 
                                    inputMode="numeric"
                                    className={`w-full bg-slate-800 border ${pwdError ? 'border-red-500' : 'border-gray-600'} rounded-lg p-3 text-white focus:outline-none focus:border-chem-accent mb-2 text-center text-2xl tracking-[0.5em] font-mono`}
                                    value={pwdInput} 
                                    onChange={e => {setPwdInput(e.target.value); setPwdError(false);}} 
                                    onKeyDown={e => e.key === 'Enter' && handlePasswordSubmit()}
                                    maxLength="4" 
                                    autoFocus
                                />
                                {pwdError && <p className="text-red-400 text-xs mb-4 animate-pulse">암호가 틀렸습니다.</p>}
                                {!pwdError && <div className="mb-4"></div>}
                                <div className="flex gap-2">
                                    <button onClick={() => setPasswordModal({isOpen: false, target: null})} className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl active:scale-95 transition-colors">취소</button>
                                    <button onClick={handlePasswordSubmit} className="flex-1 py-3 bg-chem-accent hover:bg-yellow-400 text-slate-900 font-bold rounded-xl active:scale-95 transition-colors">잠금 해제</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {rankModalOpen && (
                        <RankModal 
                            scoreData={memScoreObj} 
                            viewOnly={isViewOnlyRank}
                            onClose={() => {
                                setRankModalOpen(false); 
                                if (!isViewOnlyRank) initMemoryGame();
                                setIsViewOnlyRank(false);
                            }}
                            onGoReport={() => setView('report')} 
                        />
                    )}
                </div>
            );
        };

        const ReportView = ({ setView, simData, setAlertMsg }) => {
            const [formData, setFormData] = useState({ studentId: '', studentName: '', insight: '' });
            const [quizzes, setQuizzes] = useState([]);
            const [quizAnswers, setQuizAnswers] = useState({}); 
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => { setQuizzes([...QUIZ_POOL].sort(() => Math.random() - 0.5).slice(0, 3)); }, []);

            const handleSubmit = async () => {
                if (!formData.studentId || !formData.studentName || !formData.insight) return setAlertMsg('모든 필드를 입력하세요.');
                if (Object.keys(quizAnswers).length < 3) return setAlertMsg('퀴즈를 모두 푸세요.');
                if (!GOOGLE_SCRIPT_URL) return setAlertMsg('DB가 연동되지 않았습니다. 가이드를 확인하세요.');

                let qScore = 0;
                quizzes.forEach((q, idx) => { if (q.a === quizAnswers[idx]) qScore += 1; });
                setIsSubmitting(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            studentId: formData.studentId, studentName: formData.studentName, insight: formData.insight,
                            classificationScore: simData.classificationScore, memoryScore: simData.memoryScore || 0, quizScore: qScore
                        })
                    });
                    setIsSubmitting(false); setView('done');
                } catch (e) {
                    setIsSubmitting(false); setView('done'); // no-cors 무조건 성공 처리
                }
            };

            return (
                <div className="h-full overflow-y-auto bg-slate-900 p-4 md:p-8 custom-scrollbar relative">
                    <div className="max-w-2xl mx-auto space-y-6">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-black text-chem-primary">실험 결과 보고서</h2>
                            <button onClick={() => setView('simulation')} className="text-gray-400 text-sm glass px-3 py-1 rounded">돌아가기</button>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div className="glass p-4 rounded-xl border border-gray-700">
                                <div className="text-xs text-gray-400 mb-1">분류 성공</div><div className="text-xl font-bold text-chem-element">{simData.classificationScore}회</div>
                            </div>
                            <div className="glass p-4 rounded-xl border border-gray-700">
                                <div className="text-xs text-gray-400 mb-1">메모리 클리어</div><div className="text-xl font-bold text-chem-accent">{simData.memoryScore ? `${simData.memoryScore}초` : '미완료'}</div>
                            </div>
                        </div>
                        <div className="glass p-5 rounded-xl border border-gray-700 space-y-4">
                            <h3 className="font-bold text-white border-b border-gray-600 pb-2">OX 퀴즈</h3>
                            {quizzes.map((q, idx) => {
                                const ans = quizAnswers[idx], isAns = ans !== undefined, isCor = ans === q.a;
                                return (
                                    <div key={idx} className="bg-slate-800 p-3 rounded-lg text-sm">
                                        <p className="mb-2 font-medium">{idx+1}. {q.q}</p>
                                        <div className="flex gap-2">
                                            <button disabled={isAns} onClick={() => setQuizAnswers(p=>({...p, [idx]:true}))} className={`flex-1 py-1 rounded font-bold ${ans===true?'bg-blue-600 text-white':'bg-slate-700'} ${isAns&&ans!==true?'opacity-50':''}`}>O</button>
                                            <button disabled={isAns} onClick={() => setQuizAnswers(p=>({...p, [idx]:false}))} className={`flex-1 py-1 rounded font-bold ${ans===false?'bg-red-600 text-white':'bg-slate-700'} ${isAns&&ans!==false?'opacity-50':''}`}>X</button>
                                        </div>
                                        {isAns && <div className={`mt-2 p-2 rounded text-xs ${isCor?'bg-green-900/50 text-green-300':'bg-red-900/50 text-red-300'}`}>{isCor?'정답!':'오답.'} {q.explain}</div>}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="glass p-5 rounded-xl border border-gray-700 space-y-3">
                            <input type="number" placeholder="학번" className="w-full bg-slate-800 border border-gray-600 rounded p-2 text-white text-sm" value={formData.studentId} onChange={e=>setFormData(f=>({...f, studentId:e.target.value}))} />
                            <input type="text" placeholder="이름" className="w-full bg-slate-800 border border-gray-600 rounded p-2 text-white text-sm" value={formData.studentName} onChange={e=>setFormData(f=>({...f, studentName:e.target.value}))} />
                            <textarea rows="3" placeholder="알게 된 점" className="w-full bg-slate-800 border border-gray-600 rounded p-2 text-white text-sm resize-none" value={formData.insight} onChange={e=>setFormData(f=>({...f, insight:e.target.value}))}></textarea>
                        </div>
                        <button onClick={handleSubmit} disabled={isSubmitting} className="w-full py-4 bg-chem-primary text-slate-900 font-black text-lg rounded-xl active:scale-95 disabled:opacity-50">
                            {isSubmitting ? '전송 중...' : '제출하기'}
                        </button>
                    </div>
                </div>
            );
        };

        const DoneView = () => (
            <div className="flex flex-col items-center justify-center h-full p-6 text-center bg-slate-900">
                <div className="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-4"><i className="fa-solid fa-check text-4xl text-slate-900"></i></div>
                <h2 className="text-2xl font-black mb-2 text-white">제출 완료!</h2>
                <button onClick={() => window.location.reload()} className="px-6 py-2 glass hover:bg-slate-800 text-white rounded-xl mt-6">처음부터 다시하기</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
